<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: app de coluna única — cabeçalho com briefing, abas segmentadas, lista agrupada e campo de entrada fixo embaixo */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface2:#f6f7f9; --fg:#1b2129; --muted:#68717d; --line:#e1e4e9;
  --accent:#2f5bd3; --accent-soft:#e3eafb; --hero:#1f2a44; --hero-fg:#f4f6fb; --hero-muted:#aab4cc;
  --p1:#d8432f; --p2:#e08a16; --p3:#2f5bd3; --ok:#24875a; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--surface:#1a2029;--surface2:#212834;--fg:#e8ecf2;--muted:#8d97a6;--line:#2a3240;--accent:#7d9cf0;--accent-soft:#25304a;--hero:#1e2840;--hero-fg:#eef2fa;--hero-muted:#9aa7c4;--p1:#f07562;--p2:#f0a84a;--p3:#7d9cf0;--ok:#4cc08a;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--surface:#1a2029;--surface2:#212834;--fg:#e8ecf2;--muted:#8d97a6;--line:#2a3240;--accent:#7d9cf0;--accent-soft:#25304a;--hero:#1e2840;--hero-fg:#eef2fa;--hero-muted:#9aa7c4;--p1:#f07562;--p2:#f0a84a;--p3:#7d9cf0;--ok:#4cc08a;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 150px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

/* Briefing */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .when{font-size:13px;color:var(--hero-muted);text-transform:capitalize;letter-spacing:.02em}
.hero h1{font-size:28px;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat{text-align:left;color:inherit;transition:background .15s}.stat:hover{background:rgba(255,255,255,.13)}.stat span::after{content:" ›"}
.stat span{font-size:12px;color:var(--hero-muted)}
.next{font-size:14px;color:var(--hero-muted)} .next b{color:var(--hero-fg);font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}

/* Abas */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);display:flex;justify-content:center;gap:5px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg .n{font-size:11px;background:var(--line);color:var(--muted);border-radius:10px;padding:0 6px;min-width:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Semana */
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.wd{flex:0 0 48px;background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.wd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd b{font-family:var(--display);font-size:19px}
.wd .dots{display:flex;gap:2px;height:5px}.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.wd[aria-pressed="true"]{background:var(--accent);color:#fff}.wd[aria-pressed="true"] small{color:rgba(255,255,255,.8)}.wd[aria-pressed="true"] .dots i{background:#fff}
.wd.today b{text-decoration:underline;text-underline-offset:3px}

/* Calendário mensal */
.cal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.calh h2{font-size:20px;text-transform:capitalize}
.calh .nav{display:flex;gap:4px}
.calh .nav button{width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--muted);background:var(--surface2)}
.calh .nav .hj{width:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .dn{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.dc{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.dc:hover{background:var(--surface2)}
.dc.out{color:var(--muted);opacity:.45}
.dc.wk{color:var(--muted)}
.dc.today{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.dc[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.dc .dots{display:flex;gap:2px;height:5px}.dc .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dc .dots i.p3{background:var(--p1)}.dc .dots i.dn{background:var(--ok)}
.dc[aria-pressed="true"] .dots i{background:#fff}
.dc .cnt{font-size:9.5px;line-height:1;color:var(--muted)}
.dc[aria-pressed="true"] .cnt{color:rgba(255,255,255,.85)}
@media (min-width:560px){.dc{aspect-ratio:auto;height:64px}}

/* Lista */
.group{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 4px}
.gh.late{color:var(--p1)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools .sp{flex:1}
.it.sl{cursor:pointer}.it.sl .more{visibility:hidden}
.sbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center}
.it.on{background:var(--accent-soft)}.it.on .sbox{background:var(--accent);border-color:var(--accent)}.sbox svg{width:13px;height:13px;opacity:0}.it.on .sbox svg{opacity:1}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.selbar .cbox{flex-direction:column;gap:8px;padding:10px}
.selbar .row1{display:flex;align-items:center;gap:8px;font-weight:700;padding:0 4px}.selbar .row1 span{flex:1}
.selbar .row1 button{font-size:13px;font-weight:600;color:var(--accent)}
.selbar .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.selbar .acts button{background:var(--surface2);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700}
.selbar .acts button.red{color:var(--p1)}
.selbar .acts button:disabled{opacity:.4}
.conf{color:var(--p2);font-weight:700}
.clk{display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:8px}
.ci input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.ci span{flex:1;overflow-wrap:anywhere}.ci.ok span{text-decoration:line-through;color:var(--muted)}
.ci button{color:var(--muted);font-size:16px;padding:0 6px}
.addci{display:flex;gap:6px}.addci input{flex:1;min-width:0;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.addci button{background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:700}
.nota{width:100%;min-height:80px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);resize:vertical}
.dlab{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 4px 2px}
.body.tap{cursor:pointer}.gh.cmp{color:var(--p2);margin-top:6px}
.gh button{font-size:12px;font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);margin-top:1px;display:grid;place-items:center;transition:background .15s}
.ck.p1{border-color:var(--p1)}.ck.p2{border-color:var(--p2)}.ck.p3{border-color:var(--p3)}
.ck svg{width:13px;height:13px;opacity:0}
.it.ok .ck{background:var(--ok);border-color:var(--ok)}.it.ok .ck svg{opacity:1}
.it.ok .tt,.it.cx .tt{text-decoration:line-through;color:var(--muted)}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.tt{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);align-items:center}
.meta .hr{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.meta .late{color:var(--p1);font-weight:600}
.tag{color:var(--accent);font-weight:600}
.ex{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.more{width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
.more:hover{background:var(--surface2)}
.empty{background:var(--surface);border-radius:14px;padding:22px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:17px;margin-bottom:4px}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}

/* Campo de entrada fixo */
.composer{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.cbox{max-width:620px;margin:0 auto;background:var(--surface);border-radius:16px;box-shadow:0 6px 24px rgba(20,30,50,.15);padding:8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.crow{display:flex;gap:8px}
.cbox input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:transparent;color:var(--fg);padding:8px}
.cbox input:focus-visible{outline:0}
.send{background:var(--accent);color:#fff;border-radius:11px;padding:0 16px;font-weight:700}
.pv{display:flex;flex-wrap:wrap;gap:5px;padding:0 6px 2px}
.pv span{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px}
.pv .warn{background:var(--surface2);color:var(--muted)}

/* Folha de ações / edição */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;max-height:90%;overflow:auto}
.sheet h3{font-size:18px;padding:4px 4px 8px}
.pop .card{box-shadow:none;border:1px solid var(--line)}.pop .sub{font-size:13px;color:var(--muted);padding:0 4px 8px;margin-top:-6px}
.act{text-align:left;padding:12px;border-radius:10px;font-weight:600}
.act:hover{background:var(--surface2)}.act.red{color:var(--p1)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select{font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.btns{display:flex;gap:8px;margin-top:8px}.btns button{flex:1;padding:12px;border-radius:12px;font-weight:700;background:var(--surface2)}.btns .pri{background:var(--accent);color:#fff}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.foot button{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;display:flex;gap:12px}
.toast button{color:var(--accent-soft);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.seg button{font-size:13px}.stat b{font-size:20px}}
.obra-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--p2);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.det{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.login{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{background:var(--surface);border-radius:20px;padding:28px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login h1{font-size:26px}.login p{color:var(--muted);margin:0}
.login button{background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:700}
.status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero" id="hero"></section>
  <nav class="seg" id="seg">
    <button data-m="hoje" aria-pressed="true">Hoje</button>
    <button data-m="semana" aria-pressed="false">Agenda</button>
    <button data-m="ok" aria-pressed="false">Feitos <span class="n" id="nok"></span></button>
    <button data-m="cx" aria-pressed="false">Desmarc. <span class="n" id="ncx"></span></button>
  </nav>
  <div id="extra" style="display:flex;flex-direction:column;gap:12px"></div>
  <div id="lista" style="display:flex;flex-direction:column;gap:18px"></div>
  <div class="foot"><span class="status" id="st">Conectando…</span><span><a href="https://englborba-tech.github.io/Obras/" style="color:var(--accent);font-weight:600">App de obras ›</a> <button id="ajustes">Notificações</button> <button id="bkp">Backup</button> <button id="sair">Sair</button></span></div>
</div>

<div class="composer">
  <div class="cbox">
    <div class="pv" id="pv"><span class="warn">Ex.: reunião sexta 11h30 na obra Lumiere #lumiere !!</span></div>
    <div class="crow">
      <input id="txt" autocomplete="off" placeholder="Adicionar compromisso ou tarefa…" aria-label="Novo compromisso">
      <button class="send" id="add">Agendar</button>
    </div>
  </div>
</div>
<div id="layer"></div>
<div class="login" id="login" hidden><div class="box"><h1>Rotina</h1><p>Entre com sua conta Google para ver sua agenda.</p><button id="entrar" type="button">Entrar com Google</button></div></div>

<script>
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"], DC=["dom","seg","ter","qua","qui","sex","sáb"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dk=s=>new Date(s+"T00:00");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REP={d:"todo dia",u:"dias úteis",w:"toda semana","2w":"a cada 2 semanas",m:"todo mês",y:"todo ano"};
const LEMB={"":"Padrão das notificações","0":"Sem lembrete","10":"10 min antes","30":"30 min antes","60":"1 h antes","120":"2 h antes","1440":"1 dia antes"};
const SEM=["domingo","segunda","terca","quarta","quinta","sexta","sabado"];

/* ---------- Interpretação da frase ---------- */
function parse(txt){
  const orig=" "+txt.trim()+" ";
  const low=orig.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const base=hoje0(); let date=null,time=null,rep=null,prio=0,tags=[],cut=[];
  const mark=m=>m&&cut.push([m.index,m.index+m[0].length]);
  const B="(?=\\s|,|\\.|$)"; let m;
  // tags e prioridade
  for(const t of low.matchAll(/\s#([\w\-]+)/g)){tags.push(t[1]);cut.push([t.index,t.index+t[0].length])}
  if(m=/\s(!{1,3})(?=\s|$)/.exec(low)){prio=m[1].length;mark(m)}
  else if(m=new RegExp("\\s(urgente|prioridade alta)"+B).exec(low)){prio=3;mark(m)}
  // recorrência
  if(m=new RegExp("\\s(a cada (?:2|duas) semanas|quinzenal|quinzenalmente)"+B).exec(low)){rep="2w";mark(m)}
  else if(m=new RegExp("\\s(todo ano|todos os anos|anualmente)"+B).exec(low)){rep="y";mark(m)}
  else if(m=new RegExp("\\s(todo dia|todos os dias|diariamente)"+B).exec(low)){rep="d";mark(m)}
  else if(m=new RegExp("\\s(dias uteis|todo dia util)"+B).exec(low)){rep="u";mark(m)}
  else if(m=new RegExp("\\s(?:toda|todo)s?\\s+(domingo|segunda|terca|quarta|quinta|sexta|sabado)s?(?:-feiras?)?"+B).exec(low)){rep="w";const i=SEM.indexOf(m[1]);date=add(base,(i-base.getDay()+7)%7);mark(m)}
  else if(m=new RegExp("\\s(toda semana|semanalmente)"+B).exec(low)){rep="w";mark(m)}
  else if(m=new RegExp("\\s(?:todo mes\\s+)?(?:todo\\s+)?dia\\s+(\\d{1,2})(?:\\s+de\\s+cada\\s+mes|\\s+de\\s+todo\\s+mes)?(?=[^]*\\b(?:todo mes|cada mes)\\b|\\s+de\\s+cada|\\s+de\\s+todo)"+B).exec(low)){rep="m";date=new Date(base.getFullYear(),base.getMonth(),+m[1]);if(date<base)date.setMonth(date.getMonth()+1);mark(m);let r=/\s(todo mes|de cada mes|de todo mes)(?=\s|,|\.|$)/.exec(low);if(r&&!(r.index>=m.index&&r.index<m.index+m[0].length))mark(r)}
  else if(m=new RegExp("\\s(todo mes|mensalmente)"+B).exec(low)){rep="m";mark(m);let r=new RegExp("\\sdia\\s+(\\d{1,2})"+B).exec(low);if(r){date=new Date(base.getFullYear(),base.getMonth(),+r[1]);if(date<base)date.setMonth(date.getMonth()+1);mark(r)}}
  // data
  if(!date){
    if(m=new RegExp("\\s(?:dia\\s+)?(\\d{1,2})\\/(\\d{1,2})(?:\\/(\\d{2,4}))?"+B).exec(low)){
      const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):base.getFullYear();
      date=new Date(y,+m[2]-1,+m[1]); if(!m[3]&&date<base)date.setFullYear(y+1); mark(m);
    }else if(m=new RegExp("\\s(?:dia\\s+)?(\\d{1,2})\\s+de\\s+("+MESES.map(x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"")).join("|")+")"+B).exec(low)){
      const mi=MESES.map(x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"")).indexOf(m[2]);
      date=new Date(base.getFullYear(),mi,+m[1]); if(date<base)date.setFullYear(date.getFullYear()+1); mark(m);
    }else if(m=new RegExp("\\sdia\\s+(\\d{1,2})"+B).exec(low)){
      date=new Date(base.getFullYear(),base.getMonth(),+m[1]); if(date<base)date.setMonth(date.getMonth()+1); mark(m);
    }else if(m=new RegExp("\\sdepois de amanha"+B).exec(low)){date=add(base,2);mark(m)}
    else if(m=new RegExp("\\samanha"+B).exec(low)){date=add(base,1);mark(m)}
    else if(m=new RegExp("\\shoje"+B).exec(low)){date=base;mark(m)}
    else if(m=new RegExp("\\s(?:daqui a|em)\\s+(\\d+)\\s+(dias?|semanas?)"+B).exec(low)){date=add(base,+m[1]*(m[2][0]==="s"?7:1));mark(m)}
    else if(m=new RegExp("\\s(?:na\\s+)?proxima semana"+B).exec(low)){date=add(base,(8-base.getDay())%7||7);mark(m)}
    else if(m=new RegExp("\\s(?:na\\s+|no\\s+|nessa\\s+|nesta\\s+|proxima\\s+|proximo\\s+)?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira)?"+B).exec(low)){
      const i=SEM.indexOf(m[1]); date=add(base,(i-base.getDay()+7)%7||7); mark(m);
    }
  }
  // hora (com intervalo: 10h às 11h30, 10h-12h, das 9h até 10h)
  let fim="";
  if(m=new RegExp("\\s(?:das?\\s+|de\\s+)?(\\d{1,2})(?:h(\\d{2})?|:(\\d{2}))\\s*(?:as|a|ate|-|–)\\s*(\\d{1,2})(?:h(\\d{2})?|:(\\d{2}))"+B).exec(low)){
    const h=+m[1],mi=+(m[2]||m[3]||0),h2=+m[4],m2=+(m[5]||m[6]||0);
    if(h<24&&h2<24&&mi<60&&m2<60){time=pad(h)+":"+pad(mi);fim=pad(h2)+":"+pad(m2);if(fim<=time)fim="";mark(m)}}
  if(time){}
  else if(m=new RegExp("\\s(?:as|a|das|ao)?\\s*(\\d{1,2})(?:h(\\d{2})?|:(\\d{2}))(?:min)?(?:\\s*(?:hrs?|horas))?"+B).exec(low)){
    const h=+m[1],mi=+(m[2]||m[3]||0); if(h<24&&mi<60){time=pad(h)+":"+pad(mi);mark(m)}
  }else if(m=new RegExp("\\s(?:as|ao)\\s+(meio[- ]dia)"+B).exec(low)){time="12:00";mark(m)}
  // tira os trechos reconhecidos
  cut.sort((a,b)=>b[0]-a[0]); let rest=orig;
  for(const [a,b] of cut) rest=rest.slice(0,a)+" "+rest.slice(b);
  rest=rest.replace(/\s+/g," ").trim().replace(/[,;.\-–]+$/,"").trim();
  let local="", titulo=rest, lm=/\s(?:no|na|em|nos|nas)\s+(.+)$/i.exec(" "+rest);
  if(lm&&lm[1].length>1){local=lm[1].trim();titulo=(" "+rest).slice(0,lm.index).trim()}
  titulo=titulo.replace(/[,\-–]+$/,"").trim();
  if(titulo)titulo=titulo[0].toUpperCase()+titulo.slice(1);
  return {titulo:titulo||"Sem título",local,data:key(date||base),hora:time||"",fim,rep,prio,tags,semData:!date&&!rep};
}

function proxima(e){
  const d=dk(e.data);
  if(e.rep==="d")return key(add(d,1));
  if(e.rep==="u"){let x=add(d,1);while(x.getDay()===0||x.getDay()===6)x=add(x,1);return key(x)}
  if(e.rep==="w")return key(add(d,7));

  if(e.rep==="y"){const x=new Date(d);x.setFullYear(x.getFullYear()+1);return key(x)}

}

function backup(){const dados=JSON.stringify({app:"rotina",versao:1,gerado:new Date().toISOString(),itens:evs.map(e=>({id:e.id,...limpa(e)}))},null,1);
  if(NATIVO){try{navigator.clipboard.writeText(dados);toast("Backup copiado. Cole num e-mail ou nota para guardar")}catch(e){toast("Faça o backup pela versão web do app")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([dados],{type:"application/json"}));a.download="Backup Rotina - "+key(hoje0())+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup baixado");}
function restaurar(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=async()=>{try{const j=JSON.parse(await i.files[0].text());const its=j.itens||[];let n=0;const ids=new Set(evs.map(e=>e.id));
    its.forEach(x=>{if(!x.id||ids.has(x.id))return;evs.push(norm({...x}));n++});save();toast(n?n+" itens restaurados":"Nada novo para restaurar")}catch(e){toast("Arquivo de backup inválido")}};i.click();}

  const a=ajustes(),b=hoje0(),dias={};
  const wi=e=>({hora:e.hora,titulo:e.titulo,local:(e.fim?"até "+e.fim+(e.local?" · ":""):"")+(e.local||""),detalhe:e.detalhe||"",prio:e.prio||0,obra:!!e.origem,data:e.data});
  for(let i=0;i<8;i++){const k=key(add(b,i));dias[k]={itens:itensDoDia(k).slice(0,20).map(wi)};}
  const atrL=ativos().filter(e=>e.data<key(b)).sort(ord).slice(0,10).map(wi);
  const obrasP=evs.filter(e=>e.origem&&!e.oculto&&!e.st&&meu(e)&&e.data<=key(add(b,7))).sort(ord).slice(0,20).map(wi);
  const m0=new Date(b.getFullYear(),b.getMonth(),1),g0=add(m0,-m0.getDay()),marcas={};
  for(let i=0;i<42;i++){const k=key(add(g0,i)),a1=propria().filter(e=>e.data===k&&!e.st).length,c1=evs.filter(e=>e.origem&&!e.oculto&&!e.st&&meu(e)&&e.data===k).length;if(a1||c1)marcas[k]={a:a1,c:c1};}
  try{await PL.WidgetBridge.update({data:JSON.stringify({dias,atrasados:atrL,obras:obrasP,marcas,atualizado:Date.now()})});}catch(e){}
  // notificações: refaz a programação dos próximos 7 dias
  const lista=[],agora=Date.now(),[hh,mm]=a.hora.split(":").map(Number);
  if(a.briefing)for(let i=0;i<7;i++){const d=add(b,i);if(!a.fimDeSemana&&(d.getDay()===0||d.getDay()===6))continue;
    const at=new Date(d);at.setHours(hh,mm,0,0);if(at.getTime()<=agora+30000)continue;const t=textoBriefing(key(d));
    lista.push({id:1000+i,channelId:"briefing",title:t.titulo,body:t.corpo,largeBody:t.corpo,schedule:{at,allowWhileIdle:true}});}
  ativos().filter(e=>e.data>=key(b)&&e.data<=key(add(b,8))).forEach((e,i)=>{
    const lb=e.lemb==null||e.lemb===""?a.lembrete:+e.lemb;if(!lb)return;if(!e.hora&&lb<1440)return;
    const at=new Date(e.data+"T"+(e.hora||"08:00")+":00");at.setMinutes(at.getMinutes()-lb);if(at.getTime()<=agora+30000)return;
    const quando=lb>=1440?"amanhã"+(e.hora?" às "+e.hora:""):"em "+(lb<60?lb+" min":lb/60+" h");
    lista.push({id:2000+i,channelId:"lembretes",title:e.titulo,body:(e.hora?e.hora+(e.fim?"–"+e.fim:""):"Dia todo")+(e.local?" · "+e.local:"")+" ("+quando+")",schedule:{at,allowWhileIdle:true}});});
  const assin=JSON.stringify(lista);if(!forcar&&assin===nsAssin)return;nsAssin=assin;
  try{const LN=PL.LocalNotifications;let p=await LN.checkPermissions();if(p.display!=="granted")p=await LN.requestPermissions();if(p.display!=="granted")return;
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(lista.length)await LN.schedule({notifications:lista});}catch(e){console.error(e);}
},800);}
if(NATIVO){
  try{PL.LocalNotifications.createChannel({id:"briefing",name:"Resumo do dia",description:"Resumo da manhã com os compromissos do dia",importance:4});
      PL.LocalNotifications.createChannel({id:"lembretes",name:"Lembretes",description:"Aviso antes de cada compromisso",importance:4});}catch(e){}
  try{Capacitor.Plugins.App&&Capacitor.Plugins.App.addListener("resume",()=>{render();nativoSync(true);});}catch(e){}
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();nativoSync(true);}});
}
render();
</script>
